name: Offline candidate verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # On a PR, github.sha is the synthetic merge commit, not the candidate head.
  CANDIDATE_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}

jobs:
  common:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify exact candidate with no harness on PATH
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          isolated="$(mktemp -d "$RUNNER_TEMP/nstack-common.XXXXXX")"
          mkdir "$isolated/bin" "$isolated/home" "$isolated/tmp"
          for command in git python3; do
            ln -s "$(command -v "$command")" "$isolated/bin/$command"
          done
          env -i HOME="$isolated/home" PATH="$isolated/bin" TMPDIR="$isolated/tmp" \
            GIT_CONFIG_NOSYSTEM=1 PYTHONUTF8=1 \
            "$isolated/bin/python3" -B tests/validate.py --suite common
  validate:
    needs: common
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CODEX_VERSION: "0.172.0"
      CODEX_ARCHIVE_SHA256: a2342a8f7f68f088be30620ccfe9cb84162c93a6b56177855961cda3ed6be392
    steps:
      - name: Require common verification
        env:
          COMMON_RESULT: ${{ needs.common.result }}
        run: test "$COMMON_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install pinned validation tools
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          asset=codex-x86_64-unknown-linux-musl
          tool_dir="$(mktemp -d "$RUNNER_TEMP/nstack-tools.XXXXXX")"
          archive="$tool_dir/codex.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/openai/codex/releases/download/rust-v${CODEX_VERSION}/${asset}.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$CODEX_ARCHIVE_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_dir" "$asset"
          install -m 0755 "$tool_dir/$asset" "$tool_dir/codex"
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Verify exact candidate without provider credentials
        shell: bash
        run: |
          unset OPENAI_API_KEY CODEX_API_KEY
          export CODEX_HOME
          CODEX_HOME="$(mktemp -d "$RUNNER_TEMP/nstack-codex-home.XXXXXX")"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$CANDIDATE_SHA"
          cli_version="$(codex --version)"
          test "$cli_version" = "codex-cli $CODEX_VERSION"
          {
            echo '### Offline candidate verification'
            printf '\n- Event: `%s`\n- Candidate SHA: `%s`\n- Codex: `%s`\n' "$GITHUB_EVENT_NAME" "$actual_sha" "$cli_version"
            printf -- '- Python: `%s`\n- Git: `%s`\n' "$(python3 --version)" "$(git --version)"
            printf -- '- PyYAML: `%s`\n' "$(python3 -c 'import yaml; print(yaml.__version__)')"
            echo '- Evidence: native Codex offline discovery and configuration plus Codex protocol fixtures. Zero authenticated model turns.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tests/validate.py --suite codex
